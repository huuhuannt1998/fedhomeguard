certification_family:
  note: >
    Generic federated-learning certification, developed outside intrusion detection.
    Recorded separately because it supplies the machinery this paper transfers, and
    because its operating points are what the manuscript compares against.
  entries:

  - key: cao2021provably
    citation: Cao, Jia, Gong, Provably Secure Federated Learning against Malicious Clients, AAAI 2021
    source_level: abstract_verified
    datasets: [MNIST, Human Activity Recognition]
    application: generic classification, not intrusion detection
    guarantee_type: certified_prediction
    accuracy_guarantee: certified accuracy lower bound
    strongest_reported_operating_point:
      certified_accuracy: 0.88
      dataset: MNIST
      n_clients: 1000
      n_malicious: 20
      beta: 0.02
    verified_quote: >
      "88% on MNIST when 20 out of 1,000 clients are malicious"

  - key: flcert2022
    citation: Cao, Zhang, Jia, Gong, FLCert, IEEE TIFS 2022
    source_level: metadata_only
    application: generic classification, not intrusion detection
    guarantee_type: certified_prediction

  - key: crfl2021
    citation: Xie, Chen, Chen, Li, CRFL, ICML 2021
    source_level: metadata_only
    application: generic classification, not intrusion detection
    guarantee_type: certified_prediction
    threat_class: bounded-magnitude backdoor (parameter smoothing), not client count

excluded:
  - key: diot2019
    citation: Nguyen et al., DIoT, ICDCS 2019
    reason: I3
    detail: >
      Federated self-learning anomaly detection for IoT. Its adversary compromises
      IoT devices whose traffic is being classified; it does not propose or evaluate
      a defence against training-time poisoning by malicious FL clients. Retained as
      a citation for the FL-IoT-IDS setting, not counted in the defence inventory.
  - key: fedidsdp2025
    citation: Privacy Preserving Federated Learning for Distributed Intrusion Detection (DP, NonIID Convergence, Byzantine Robustness)
    reason: E4
    detail: >
      Surfaced by query 4 and clearly in scope on title. Only a ResearchGate record
      was reachable and it returned HTTP 403, so no field could be coded at even
      abstract level. Recorded as retrieval-blocked rather than dropped silently:
      the title asserts differential-privacy guarantees, non-IID convergence, and
      Byzantine robustness via Krum, which would code as privacy + convergence +
      byzantine_statistical rather than certified_prediction, but that is an
      inference from the title and is NOT counted.
