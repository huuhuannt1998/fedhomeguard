# Rows of the assumptions table (tab:assumptions, JISA round jisa2; feedback F5). Every number here must appear in an
# accepted evidence use (the manuscript gate's `numbers` check reads the built table). Columns: the assumption, what
# the experiments show under it, what they do not license, and where the paper treats it.
rows:
  - assumption: "Household ownership is synthetic, built over per-device captures"
    shows: "how the certificate behaves under controlled partition families"
    not_licensed: "how real homes' devices and classes are distributed"
    where: "Sec.~\\ref{sec:S4}"
  - assumption: "On IoT-23 a capture type stands for a device: two real devices and eight malware captures on one Raspberry Pi"
    shows: "class coverage decides collapse under strong device-label coupling (37.4\\% of the label entropy)"
    not_licensed: "that a device count predicts certification in a real home"
    where: "Secs.~\\ref{sec:S6}, \\ref{sec:S7}"
  - assumption: "Train and test share devices; 73.7\\% of test flows have an identical training feature vector; one-hot vocabularies are built over the whole corpus"
    shows: "on the deduplicated flows the IID ensemble still certifies 0.9193 at $k=1$, $\\beta=0.40$"
    not_licensed: "generalization to unseen devices"
    where: "Sec.~\\ref{sec:S4}, App.~\\ref{sec:C}"
  - assumption: "The test split is 73\\% malicious ($\\tau_{\\mathrm{triv}}=0.7300$)"
    shows: "certified accuracy and $\\beta^{*}$ relative to that floor"
    not_licensed: "deployability: at a 1\\% prior no certified configuration beats the constant benign predictor"
    where: "Secs.~\\ref{sec:S2}, \\ref{sec:S5}"
  - assumption: "$N=20$ households, every drawn client takes part in every round"
    shows: "the exact ceiling at $N=20$; the large-$N$ ceiling holds at every federation size; at $N=10$ and 50 device-derived collapse stays at 28 and 29 of 30"
    not_licensed: "certificates under partial participation"
    where: "Sec.~\\ref{sec:S3}"
  - assumption: "Members are trained by plain FedAvg, so one client can set a member it touches"
    shows: "the ceiling $1-2^{-1/k}$ binds and is attained under IID partitions"
    not_licensed: "the reach of members trained with robust aggregation, which escape the ceiling"
    where: "Secs.~\\ref{sec:S3}, \\ref{sec:S10}"
  - assumption: "Attacks: five published ones, and the exact worst case over member outputs at $k \\le 2$"
    shows: "the certificate's soundness, and its tightness under IID partitions"
    not_licensed: "the damage optimized attacks would do, which the certificate bounds but we do not run"
    where: "Sec.~\\ref{sec:S5}, App.~\\ref{sec:B}"
  - assumption: "Member seed 0, and seeds 1--4 for the main grid and the coverage repair; partition draws vary household assignment and malicious sets"
    shows: "variation across draws, with Wilson intervals for collapse; the main grid collapses on 27 of 30 draws at every seed, the repair on 0 to 4"
    not_licensed: "training-seed variance for the other draw sets"
    where: "Secs.~\\ref{sec:S4}, \\ref{sec:S6}"
  - assumption: "The count of one-class members predicts $\\beta^{*}$"
    shows: "within one grid step on 84.4\\% of IoT-23's 160 device-derived draws"
    not_licensed: "prediction on other corpora: on CIC IoT-IDAD 2024, read on the victim side, it is within one step on 2 of 60"
    where: "Sec.~\\ref{sec:S6}, App.~\\ref{sec:D}"
  - assumption: "No physical deployment"
    shows: "--"
    not_licensed: "operational performance beyond the false-alarm arithmetic"
    where: "Sec.~\\ref{sec:S5}"
