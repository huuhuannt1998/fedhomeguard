# Rows of the certified-defense comparison table (tab:certfl, JISA round jisa3; feedback F9). Every value is as
# reported in the cited paper, read from the paper itself on 2026-10-16 (feedback/lit_certified_fl_table.md gives the
# table, figure and page of each). No value is read off a plotted curve. Every number here must appear in the accepted
# evidence use P-040 (the manuscript gate's `numbers` check reads the built table).
rows:
  - defense: "DPA \\citep{levine2021dpa}"
    budget: "poisoned training samples (symmetric difference)"
    certificate: "deterministic"
    setting: "centralized; MNIST, CIFAR-10, GTSRB"
    point: "50\\% certified at 509 of 60,000 samples (MNIST)"
  - defense: "Finite Aggregation \\citep{wang2022finite}"
    budget: "poisoned training samples"
    certificate: "deterministic"
    setting: "centralized; MNIST, CIFAR-10, GTSRB"
    point: "80.17\\% at 300 of 60,000 samples (MNIST)"
  - defense: "Bagging \\citep{jia2021bagging}"
    budget: "poisoned training samples"
    certificate: "probabilistic (99.9\\% confidence)"
    setting: "centralized; MNIST, CIFAR-10"
    point: "91.1\\% at 100 of 60,000 samples (MNIST)"
  - defense: "Run-off Election \\citep{rezaei2023runoff}"
    budget: "poisoned training samples"
    certificate: "deterministic"
    setting: "centralized; MNIST, CIFAR-10, GTSRB"
    point: "81.75\\% at 300 of 60,000 samples (MNIST)"
  - defense: "Ensemble FedAvg \\citep{cao2021provably}"
    budget: "malicious clients"
    certificate: "probabilistic (99.9\\%) when subsets are sampled, deterministic when all are trained"
    setting: "federated; MNIST, HAR"
    point: "88\\% at 20 of 1,000 clients (MNIST); zero at 9 of 30 clients (HAR, all 435 pairs)"
  - defense: "FLCert-P, FLCert-D \\citep{flcert2022}"
    budget: "malicious clients"
    certificate: "probabilistic (P), deterministic (D)"
    setting: "federated; MNIST, CIFAR-10, HAR, Reddit"
    point: "FLCert-D: 81\\% at 100 of 1,000 clients, about two clients per group (MNIST); FLCert-P: above zero up to 8 of 30 clients (HAR, two per group)"
  - defense: "CRFL \\citep{crfl2021}"
    budget: "norm of the backdoor perturbation"
    certificate: "probabilistic"
    setting: "federated; LOAN, MNIST, EMNIST"
    point: "curves over the radius only"
  - defense: "CARVY-FL \\citep{nakada2026carvy}"
    budget: "malicious clients"
    certificate: "deterministic"
    setting: "federated; MNIST, Fashion-MNIST"
    point: "above 80\\% up to 5 of 100 clients (MNIST)"
  - defense: "This paper"
    budget: "malicious clients"
    certificate: "deterministic, for the deployed ensemble"
    setting: "federated; IoT-23, N-BaIoT"
    point: "median 0.9779 over 30 draws at 8 of 20 households (IID IoT-23, $k=1$); device-derived skew: Section~\\ref{sec:S5}"
