# Rows of the cross-reference table tab:variants (JISA round jisa4; AutoResearchClaw r1 item C9 and editor item (a)6).
# Each row is a value the paper already prints for device-derived IoT-23 partitions at k = 1, with the statistic and
# the draws behind it, so that a reader can tell why the same quantity has several values. No value is new here;
# every one is printed elsewhere in the paper from an accepted evidence use.
rows:
